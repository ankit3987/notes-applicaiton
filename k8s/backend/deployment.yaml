apiVersion: apps/v1
kind: Deployment
metadata: 
  name: api
  namespace: three-tier
  labels: 
    role: api
    env: demo
spec: 
  replicas: 2
  strategy: 
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 25%
  selector: 
    matchLabels:
      role: api
  template:
    metadata:
      labels:
        role: api
    spec:
      imagePullSecrets:
      - name: ecr-registry-secret
      containers:
      - name: api
        image: ankitrawat3987/backend-app:04
        imagePullPolicy: Always
#        env:
#          - name: MONGO_CONN_STR
#            value: mongodb://mongodb-svc:27017/myappdb?directConnection=true
#          - name: MONGO_USERNAME
#            valueFrom:
#              secretKeyRef:
#                name: mongo-sec
#                key: username
#          - name: MONGO_PASSWORD
#            valueFrom:
#              secretKeyRef:
#                name: mongo-sec
#                key: password
        envFrom:
           - configMapRef:
                  name: backend-config
           - secretRef:
                  name: mongo-sec


        ports:
        - containerPort: 5000
        livenessProbe: 
          httpGet:
            path: /ok
            port: 5000
          initialDelaySeconds: 2
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /ok
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
          successThreshold: 1
